<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e2e5ec;--ac:#2f6fed;--ok:#18a34a;--hi:#2f6fed;--mid:#c58a00;--low:#e0362b;--warn:#fde047;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mut:#98a1b3;--bd:#2c3340;--ac:#6b9bff;--ok:#3ec878;--hi:#6b9bff;--mid:#facc15;--low:#ff6b5e;--warn:#a98d0c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mut:#98a1b3;--bd:#2c3340;--ac:#6b9bff;--ok:#3ec878;--hi:#6b9bff;--mid:#facc15;--low:#ff6b5e;--warn:#a98d0c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mut);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
.bar input[type=search]{flex:1 1 160px}
button.b,.seg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
button.b.p{background:var(--ac);border-color:var(--ac);color:#fff}button.b.d{color:var(--low)}
.seg{display:flex;border-radius:8px;overflow:hidden}.seg button{border-radius:0}.seg button.on{background:var(--ac);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.k,.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k{margin:0}.k b{display:block;font-size:24px}.k span,.mut,small{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center}.c:hover{border-color:var(--ac)}
.av{width:52px;height:52px;border-radius:50%;background:var(--bd);color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;background-size:cover;background-position:center}
.av.s{width:34px;height:34px;font-size:12px}.av.l{width:72px;height:72px;font-size:22px}
.nm{font-size:13px;font-weight:600;line-height:1.25}.g{font-size:20px;font-weight:700}
.hi{color:var(--hi)}.mid{color:var(--mid)}.low{color:var(--low)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--bd);font-size:13px}
th{color:var(--mut);font-weight:600;white-space:nowrap}td:first-child,th:first-child{text-align:left}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
tr.arq{opacity:.65}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bd);color:var(--mut);font-weight:600;margin-left:6px}
.row{display:flex;align-items:center;gap:8px}
td input{width:100%;min-width:60px}td input.n{width:70px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.empty{padding:30px;text-align:center;color:var(--mut)}
.pa{width:100%;border:0;border-radius:6px;padding:6px 2px;font-weight:700;cursor:pointer;min-width:34px;background:var(--ok);color:#fff}.pa.f{background:var(--low);color:#fff}.pa.j{background:#f59e0b;color:#1d2330}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:16px}dialog::backdrop{background:#0008}
.x{margin-left:auto;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9}
textarea{width:100%;min-height:110px}
.auth-box{max-width:380px;margin:60px auto;text-align:center}
.soma-ok{color:#18a34a !important}
.soma-baixo{color:#ef4444 !important}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px;margin-top:10px}.sg label{display:flex;gap:6px;align-items:center;font-size:13px}
</style>
<!-- SDKs do Firebase -->
<script src="./vendor/firebase-app-compat.js"></script>
<script src="./vendor/firebase-auth-compat.js"></script>
<script src="./vendor/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="w">
<div class="top">
  <h1>Dashboard de Notas <small id="status-sync">· nuvem</small></h1>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <button id="btn-install" class="b" style="display:none;font-size:12px;padding:6px 10px" onclick="installApp()">Instalar app</button>
    <select id="mat" onchange="S.mat=this.value;render()"><option value="ef">Educação Física</option><option value="xd">Xadrez</option></select>
    <small id="user-account" style="display:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></small>
    <button id="btn-logout" class="b" style="display:none;font-size:12px;padding:6px 10px" onclick="logout()">Trocar conta</button>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div id="app"><div class="empty">Verificando autenticação…</div></div>
</div>
<dialog id="dlg"></dialog><input type="file" id="file" accept="image/*" hidden><div id="toast"></div>
<datalist id="tl"></datalist>
<script>
// =========================================================================
// COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE:
const firebaseConfig = {
  apiKey: "AIzaSyCXFgQJC82ALuYGkvV7hd4fkPz7oi4BSDA",
  authDomain: "notas-escola.firebaseapp.com",
  projectId: "notas-escola",
  storageBucket: "notas-escola.firebasestorage.app",
  messagingSenderId: "440826814470",
  appId: "1:440826814470:web:2782c7ad823dfea63a6387"
};
// =========================================================================

if(!window.firebase||typeof window.firebase.auth!="function"||typeof window.firebase.firestore!="function"){
 document.getElementById("app").innerHTML='<div class="panel"><b>Não foi possível carregar o login</b><p class="mut">Os arquivos Firebase não foram encontrados. Publique a pasta <code>vendor</code> completa no GitHub, ao lado deste HTML, e recarregue a página.</p></div>';
 throw new Error("SDKs Firebase ausentes. Verifique a pasta vendor/ publicada junto com o HTML.");
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const firestore = firebase.firestore();
const persistenceReady=firestore.enablePersistence({synchronizeTabs:true}).then(()=>{
 offlinePersistence=true;
 updateSyncStatus();
},e=>{
 offlinePersistence=false;
 console.error("Persistência offline do Firestore indisponível:",e);
 updateSyncStatus();
 toast("Cache offline indisponível: "+(e.message||e.code));
});

const MAT={ef:"Educação Física",xd:"Xadrez"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=n=>n==null?"–":n.toFixed(2).replace(".",",");
const cl=n=>n==null?"":n>=8?"hi":n>=7?"mid":"low";
const cs=n=>n==null?"":n>=21?"soma-ok":"soma-baixo";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const num=x=>typeof x=="number";
const mx=x=>{const v=(x||[]).filter(num);return v.length?Math.max(...v):null};
const ini=n=>n.split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fD=d=>d.slice(8)+"/"+d.slice(5,7)+" "+["dom","seg","ter","qua","qui","sex","sáb"][new Date(d+"T12:00").getDay()];

let A={},V={},C={},HP={},user=null,unsubs=[],target=null;
const S={tab:"p",mat:"ef",tri:"3",turma:"",q:"",faixa:"",ord:"n",view:"c",at:"3",aid:null,nv:false,del:null,arqFiltro:"ativos"};

function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}

let installPrompt=null,offlinePersistence=null;
const pendingSync=new Set();
function updateSyncStatus(){
 const el=$("status-sync");if(!el)return;
 if(!navigator.onLine){
   el.textContent=offlinePersistence===false?"· offline · cache indisponível":"· offline · dados neste aparelho";
 }else if(pendingSync.size){
   el.textContent="· sincronizando alterações";
 }else if(offlinePersistence===false){
   el.textContent="· online · cache offline indisponível";
 }else{
   el.textContent="· online";
 }
}
window.addEventListener("online",updateSyncStatus);
window.addEventListener("offline",updateSyncStatus);
window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();
 installPrompt=e;
 $("btn-install").style.display="inline-block";
});
window.addEventListener("appinstalled",()=>{
 installPrompt=null;
 $("btn-install").style.display="none";
 toast("Aplicativo instalado");
});
async function installApp(){
 if(!installPrompt)return;
 installPrompt.prompt();
 await installPrompt.userChoice;
 installPrompt=null;
 $("btn-install").style.display="none";
}
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./service-worker.js").catch(e=>{
  console.error("Falha ao registrar o modo offline:",e);
  toast("Não foi possível ativar o modo offline. Abra o programa por um endereço HTTPS.");
 });
}

const userCol = c => firestore.collection("users").doc(user.uid).collection(c);
const wr=async(c,id,d)=>{try{await userCol(c).doc(id).set(d)}catch(e){toast("Erro ao salvar: "+(e.message||e.code))}};
const rm=async(c,id)=>{try{await userCol(c).doc(id).delete()}catch(e){toast("Erro ao excluir")}};

const isArq=a=>!!(a&&a.arquivado);
const set=(k,v)=>{S[k]=v;render()};
const sel=(k,o)=>`<select onchange="set('${k}',this.value)">${o.map(([v,l])=>`<option value="${esc(v)}"${S[k]==v?" selected":""}>${esc(l)}</option>`).join("")}</select>`;

const turmas=(incArq=false)=>[...new Set(Object.values(A).filter(a=>incArq||!isArq(a)).map(a=>a.turma||"Sem turma"))].sort();
const alunos=(t,incArq=false)=>Object.entries(A).filter(([,a])=>(incArq||!isArq(a))&&(!t||(a.turma||"Sem turma")==t)).sort((x,y)=>x[1].nome.localeCompare(y[1].nome));

const avs=(mat,t)=>Object.entries(V).filter(([,a])=>a.mat==mat&&a.tri==t&&!a.enc).sort((x,y)=>(x[1].data||"").localeCompare(y[1].data||""));
const triAvg=(id,t,mat=S.mat)=>avg(avs(mat,t).map(([,a])=>mx((a.notas||{})[id])).filter(n=>n!=null));
const mf=id=>{const v=[1,2,3].map(t=>triAvg(id,t)).filter(n=>n!=null);return [avg(v),v.length?v.reduce((x,y)=>x+y,0):null]};
const nota=id=>+S.tri?triAvg(id,+S.tri):avg([1,2,3].map(t=>triAvg(id,t)).filter(n=>n!=null));
const freq=id=>{const l=Object.values(C).filter(c=>c.mat==S.mat&&c.p&&c.p[id]&&!c.enc);return l.length?100*l.filter(c=>c.p[id]=="P").length/l.length:null};
const avt=(id,sm="")=>A[id]&&A[id].foto?`<div class="av ${sm}" style="background-image:url(${A[id].foto})"></div>`:`<div class="av ${sm}">${ini(A[id].nome)}</div>`;
const bars=it=>it.map(([l,v])=>`<div class="row" style="margin:6px 0"><span style="width:110px;font-size:12px;color:var(--mut)">${l}</span><div style="flex:1;background:var(--bd);border-radius:6px;height:16px"><div style="width:${v==null?0:v*10}%;height:100%;border-radius:6px;background:var(--${v==null||v>=8?"hi":v>=7?"mid":"low"})"></div></div><b style="width:44px;text-align:right">${f(v)}</b></div>`).join("");

function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => toast("Erro no login: " + e.message));
}
function logout(){
  unsubs.forEach(u=>u());unsubs=[];
  auth.signOut();
}

function render(){
 $("mat").value=S.mat;
 if(!user){
   $("tabs").innerHTML="";
   $("user-account").style.display="none";
   $("btn-logout").style.display="none";
   $("mat").style.display="none";
   $("app").innerHTML=`<div class="panel auth-box"><h2>Acesso Restrito</h2><p class="mut" style="margin-bottom:20px">Faça login com sua conta Google para acessar e sincronizar suas notas entre o computador e o celular.</p><button class="b p" style="width:100%;padding:12px;font-weight:600" onclick="login()">Entrar com Google</button></div>`;
   return;
 }
 $("user-account").textContent=user.email||"Conta Google conectada";
 $("user-account").style.display="inline-block";
 $("btn-logout").style.display="inline-block";
 $("mat").style.display="inline-block";
 $("tabs").innerHTML=[["p","Painel"],["a","Alunos"],["v","Avaliações"],["c","Chamada"],["m","Avançar ano"],["i","Importar"],["b","Backup"]].map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="set('tab','${k}')">${l}</button>`).join("");
 $("tl").innerHTML=turmas(true).map(t=>`<option value="${esc(t)}">`).join("");
 $("app").innerHTML=({p:pPanel,a:aPanel,v:vPanel,c:cPanel,m:mPanel,i:iPanel,b:bPanel})[S.tab]();
 if(S.tab=="p")paint();
}

/* ---------- PAINEL ---------- */
function pPanel(){
 return `<div class="bar">${sel("tri",[["3","3º trimestre"],["2","2º trimestre"],["1","1º trimestre"],["0","Média dos trimestres"]])}${sel("turma",[["","Todas as turmas"],...turmas().map(t=>[t,t])])}${sel("faixa",[["","Todas as notas"],["a","8,0 ou mais"],["b","7,0 a 7,99"],["c","Abaixo de 7,0"]])}${sel("ord",[["n","Ordem alfabética"],["d","Maior nota"],["u","Menor nota"]])}<input type="search" placeholder="Buscar aluno…" value="${esc(S.q)}" oninput="S.q=this.value;paint()"><div class="seg"><button class="${S.view=="c"?"on":""}" onclick="set('view','c')">Cartões</button><button class="${S.view=="t"?"on":""}" onclick="set('view','t')">Tabela</button></div></div><div id="out"></div>`;
}
function paint(){
 const q=S.q.toLowerCase();
 let r=alunos(S.turma).filter(([id,a])=>{const g=nota(id);return a.nome.toLowerCase().includes(q)&&(!S.faixa||g!=null&&(S.faixa=="a"?g>=8:S.faixa=="b"?g>=7&&g<8:g<7))});
 const o=S.ord,gv=id=>nota(id)??-1;
 if(o=="d")r.sort((x,y)=>gv(y[0])-gv(x[0]));if(o=="u")r.sort((x,y)=>gv(x[0])-gv(y[0]));
 if(!alunos("").length){$("out").innerHTML='<div class="empty">Nenhum aluno ativo. Vá na aba <b>Alunos</b> para cadastrar, desarquivar ou importar sua planilha/backup.</div>';return}
 const g=r.map(([id])=>nota(id)).filter(n=>n!=null);
 let h=`<div class="kpis"><div class="k"><b>${r.length}</b><span>alunos</span></div><div class="k"><b class="${cl(avg(g))}">${f(avg(g))}</b><span>média do grupo</span></div><div class="k"><b>${f(g.length?Math.max(...g):null)}</b><span>maior nota</span></div><div class="k"><b>${f(g.length?Math.min(...g):null)}</b><span>menor nota</span></div><div class="k"><b class="${g.some(x=>x<7)?"low":"hi"}">${g.filter(x=>x<7).length}</b><span>abaixo de 7,0</span></div></div>`;
 h+=`<div class="panel"><div class="mut" style="margin-bottom:6px">Média por trimestre · ${MAT[S.mat]}</div>${bars([1,2,3].map(t=>[t+"º trimestre",avg(r.map(([id])=>triAvg(id,t)).filter(n=>n!=null))]))}</div>`;
 if(!r.length)h+='<div class="empty">Nenhum aluno com esses filtros.</div>';
 else if(S.view=="c")h+='<div class="grid">'+r.map(([id,a])=>{const n=nota(id),fq=freq(id);return `<div class="c" onclick="openP('${id}')">${avt(id)}<div><div class="nm">${esc(a.nome)}</div><div class="g ${n==null?"":cl(n)}">${f(n)}</div><small>${fq==null?"":"freq. "+Math.round(fq)+"%"}</small></div></div>`}).join("")+"</div>";

function openP(id,keep){

 {const [m,s]=mf(id);h+=`<p>Média final: <b class="${cl(m)}">${f(m)}</b> · Soma dos trimestres: <b class="${cs(s)}">${f(s)}</b></p>`}
 h+=`<div class="tw"><table><thead><tr><th>Avaliação</th><th>Nota</th><th>Rec.</th><th>Final</th></tr></thead><tbody>`+(

 )+"</tbody></table></div>";
 h+=`<div class="bar" style="margin:0">${livres.length?`<select onchange="addPE('${id}',this.value)" style="flex:1 1 180px"><option value="">+ Lançar nota em outra avaliação…</option>${livres.map(r=>`<option value="${r.vid}">${r.tr}º · ${esc(r.nome)}</option>`).join("")}</select>`:""}<button class="b p" style="margin-left:auto" onclick="saveP('${id}')">Salvar notas</button></div><small>A nota final é a maior entre a nota e a recuperação. Deixe os dois campos vazios para remover a nota.</small>`;

/* ---------- AVANÇAR ANO (promoção em lote) ---------- */
const rs=()=>{const y=scrollY;render();scrollTo(0,y)};
const pr=()=>S.pr||(S.pr={ano:String(new Date().getFullYear()),enc:true,acao:{},dest:{},rep:{},open:{}});
const numT=t=>parseInt((/\d+/.exec(t)||["0"])[0]);
const sugT=t=>/\d+/.test(t)?t.replace(/\d+/,numT(t)+1):"";
const pAc=t=>pr().acao[t]??(numT(t)>=9?"f":"a");
const pDe=t=>pr().dest[t]??sugT(t);
const lastP=()=>Object.entries(HP).sort((x,y)=>y[1].ts-x[1].ts)[0];
const commitOps=async ops=>{for(let i=0;i<ops.length;i+=400){const b=firestore.batch();ops.slice(i,i+400).forEach(o=>o(b));await b.commit()}};

function pPlan(){
 const P=pr(),mv=[],res=[];
 for(const t of turmas().filter(t=>t!="Sem turma")){
  const L=alunos(t),ac=pAc(t),de=pDe(t).trim(),rep=L.filter(([id])=>P.rep[id]).length;let n=0;
  if(ac=="a"&&de&&de!=t)L.forEach(([id])=>{if(!P.rep[id]){mv.push({id,de:t,para:de});n++}});
  else if(ac=="f")L.forEach(([id])=>{if(!P.rep[id]){mv.push({id,de:t,para:t,arq:1});n++}});
  res.push({t,ac,de,tot:L.length,rep,n});
 }
 return {mv,res};
}

function mSum(){
 const P=pr(),{mv,res}=pPlan(),n=mv.length;
 const ln=res.map(r=>{
  const rp=r.rep?` · ${r.rep} repete${r.rep>1?"m":""}`:"";
  if(r.ac=="m")return `<li>${esc(r.t)}: todos ficam na turma</li>`;
  if(r.ac=="f")return `<li>${esc(r.t)}: <b>${r.n}</b> concluem (arquivados)${rp}</li>`;
  if(!r.de)return `<li class="low">${esc(r.t)}: informe a turma de destino</li>`;
  if(r.de==r.t)return `<li>${esc(r.t)}: destino igual à turma atual, ninguém muda</li>`;
  return `<li>${esc(r.t)} → <b>${esc(r.de)}</b>: ${r.n} avançam${rp}</li>`;
 }).join("");
 return `<b>Resumo</b><ul style="margin:6px 0 10px">${ln}</ul>${P.enc?'<p class="mut" style="margin:0 0 10px">As avaliações e chamadas atuais serão ocultadas (ficam salvas).</p>':""}<div class="bar" style="margin:0"><button class="b p" onclick="applyP()">${S.pc?`Confirmar: mover ${n} aluno(s)${P.enc?" e encerrar o ano":""}`:`Aplicar (${n} aluno${n==1?"":"s"})`}</button>${S.pc?'<button class="b" onclick="S.pc=false;rs()">Cancelar</button>':""}</div>`;
}

function mPanel(){
 const P=pr(),{res}=pPlan(),hs=Object.entries(HP).sort((x,y)=>y[1].ts-x[1].ts);
 if(!res.length)return '<div class="empty">Nenhum aluno ativo com turma. Cadastre alunos na aba <b>Alunos</b>.</div>';
 const OP=[["a","Avançar para"],["m","Manter na turma"],["f","Concluir (arquivar)"]];
 let h=`<div class="panel"><b>Avançar alunos de ano</b><p class="mut" style="margin:4px 0 10px">Escolha o destino de cada turma e marque só quem vai repetir: todos os outros avançam de uma vez. Nada é apagado e a última promoção pode ser desfeita.</p><div class="bar" style="margin:0"><label>Ano letivo que termina: <input value="${esc(P.ano)}" style="width:80px" oninput="pr().ano=this.value"></label><label style="display:flex;gap:6px;align-items:flex-start;flex:1 1 260px"><input type="checkbox" ${P.enc?"checked":""} onchange="pr().enc=this.checked;S.pc=false;$('msum').innerHTML=mSum()"><span>Encerrar o ano: oculta as avaliações e chamadas atuais de todas as turmas, para o novo ano começar zerado</span></label></div></div>`;
 h+=res.map(r=>{const L=alunos(r.t);return `<div class="panel"><div class="bar" style="margin:0"><b style="min-width:90px">${esc(r.t)}</b><select data-t="${esc(r.t)}" onchange="pr().acao[this.dataset.t]=this.value;S.pc=false;rs()">${OP.map(([v,l])=>`<option value="${v}"${r.ac==v?" selected":""}>${l}</option>`).join("")}</select>${r.ac=="a"?`<input list="tl" data-t="${esc(r.t)}" value="${esc(r.de)}" placeholder="Turma de destino" oninput="pr().dest[this.dataset.t]=this.value;S.pc=false;$('msum').innerHTML=mSum()">`:""}<small style="margin-left:auto">${L.length} aluno(s)</small></div><details data-t="${esc(r.t)}" ${P.open[r.t]?"open":""} ontoggle="pr().open[this.dataset.t]=this.open" style="margin-top:8px"><summary class="mut" style="cursor:pointer">Marcar quem repete…</summary><div class="sg">${L.map(([id,a])=>`<label><input type="checkbox" ${P.rep[id]?"checked":""} onchange="togRep('${id}',this.checked)"> ${esc(a.nome)}</label>`).join("")}</div></details></div>`}).join("");
 h+=`<div class="panel" id="msum">${mSum()}</div>`;
 h+=`<div class="panel"><b>Promoções feitas</b>`+(hs.length?`<div class="tw" style="margin:8px 0 0"><table><thead><tr><th>Data</th><th>Ano</th><th>Alunos movidos</th><th></th></tr></thead><tbody>${hs.map(([id,p],i)=>`<tr><td>${new Date(p.ts).toLocaleDateString("pt-BR")}</td><td>${esc(p.ano)}${p.enc?'<span class="badge">ano encerrado</span>':""}</td><td>${p.moves.length}</td><td>${i==0?`<button class="b d" onclick="undoP()">${S.pu==id?"Confirmar: desfazer":"Desfazer"}</button>`:"<small>só a mais recente</small>"}</td></tr>`).join("")}</tbody></table></div><p class="mut" style="margin:8px 0 0">Desfazer devolve cada aluno à turma anterior e reexibe as avaliações e chamadas ocultas por aquela promoção. Alunos que você mudou de turma depois dela não são alterados.</p>`:'<p class="mut" style="margin:6px 0 0">Nenhuma ainda.</p>')+`</div>`;
 return h;
}
const togRep=(id,v)=>{const P=pr();if(v)P.rep[id]=true;else delete P.rep[id];S.pc=false;$("msum").innerHTML=mSum()};

async function applyP(){
 const P=pr(),{mv,res}=pPlan(),bad=res.find(r=>r.ac=="a"&&!r.de);
 if(bad)return toast("Informe o destino da turma "+bad.t);
 if(!mv.length&&!P.enc)return toast("Nada para mudar");
 if(!S.pc){S.pc=true;return $("msum").innerHTML=mSum()}
 S.pc=false;
 const pid=uid(),enc=!!P.enc;
 try{
  toast("Aplicando…");
  await userCol("promocoes").doc(pid).set({ts:Date.now(),ano:P.ano.trim()||String(new Date().getFullYear()),enc,moves:mv});
  const ops=mv.map(m=>b=>b.update(userCol("alunos").doc(m.id),m.arq?{arquivado:true}:{turma:m.para}));
  if(enc){
   Object.entries(V).forEach(([id,d])=>{if(!d.enc)ops.push(b=>b.update(userCol("aval").doc(id),{enc:pid}))});
   Object.entries(C).forEach(([id,d])=>{if(!d.enc)ops.push(b=>b.update(userCol("chamada").doc(id),{enc:pid}))});
  }
  await commitOps(ops);
  S.pr=null;S.turma="";render();
  toast(mv.length+" aluno(s) atualizado(s)"+(enc?" · ano encerrado":""));
 }catch(e){toast("Erro ao aplicar: "+(e.message||e.code))}
}

async function undoP(){
 const u=lastP();if(!u)return;
 const [pid,p]=u;
 if(S.pu!=pid){S.pu=pid;return rs()}
 S.pu=null;
 try{
  let skip=0;const ops=[],del=firebase.firestore.FieldValue.delete();
  for(const m of p.moves){
   const a=A[m.id],ref=userCol("alunos").doc(m.id);
   if(!a){skip++;continue}
   if(m.arq){if(isArq(a))ops.push(b=>b.update(ref,{arquivado:false}));else skip++}
   else if((a.turma||"")==m.para)ops.push(b=>b.update(ref,{turma:m.de}));
   else skip++;
  }
  Object.entries(V).forEach(([id,d])=>{if(d.enc==pid)ops.push(b=>b.update(userCol("aval").doc(id),{enc:del}))});
  Object.entries(C).forEach(([id,d])=>{if(d.enc==pid)ops.push(b=>b.update(userCol("chamada").doc(id),{enc:del}))});
  await commitOps(ops);
  await userCol("promocoes").doc(pid).delete();
  toast("Promoção desfeita"+(skip?` · ${skip} aluno(s) não alterado(s) por mudanças posteriores`:""));
 }catch(e){toast("Erro ao desfazer: "+(e.message||e.code))}
}

/* ---------- IMPORTAR ---------- */
let IMP=null;
function csv(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){r.push(c);c=""}else if(h=="\n"||h=="\r"){if(h=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";R.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").toLowerCase();
const tc=s=>s.trim().toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/ (Da|De|Do|Das|Dos|E) /g,x=>x.toLowerCase());
function parseCsv(t){
 const R=csv(t),yr=new Date().getFullYear(),H=[0,1,2].map(i=>R[i]||[]),ES=[],AV=[],CH=[];
 for(let i=3;i<R.length;i++){const n=(R[i][1]||"").trim();if(n)ES.push({row:i,nome:tc(n),turma:(R[i][2]||"").trim()})}
 const tm=(ES.find(s=>s.turma)||{}).turma||"";
 ES.forEach(s=>{s.turma=s.turma||tm;s.id="s_"+slug(s.turma+" "+s.nome)});
 H[1].forEach((x,j)=>{const m=/^(\d\d)\/(\d\d)$/.exec((x||"").trim());if(m)CH.push({j,data:`${yr}-${m[2]}-${m[1]}`})});
 let sec=null;
 for(let j=0;j<H[0].length;j++){
  const m=/^(\d)º\s*Trimestre\s*-\s*(.+)$/i.exec((H[0][j]||"").trim());if(m)sec={tri:+m[1],mat:/xadrez/i.test(m[2])?"xd":"ef"};
  const a=/^Avalia[çc][ãa]o\s*\d+\s*-\s*(.+)$/i.exec((H[1][j]||"").trim());
  if(a&&sec){const d=/(\d\d)\/(\d\d)/.exec(H[2][j]||""),notas={};
   ES.forEach(s=>{let n=pn(R[s.row][j]||""),r=pn(R[s.row][j+1]||"");if(isNaN(n))n=null;if(isNaN(r))r=null;if(n!=null||r!=null)notas[s.id]=[n,r]});
   if(Object.keys(notas).length){const nm=a[1].trim();AV.push({...sec,nome:nm[0].toUpperCase()+nm.slice(1),data:d?`${yr}-${d[2]}-${d[1]}`:"",turma:tm,notas})}}}
 const att=CH.map(c=>{const p={};ES.forEach(s=>{const v=(R[s.row][c.j]||"").trim().toUpperCase();if(v[0]=="P")p[s.id]="P";else if(/^(FJ|JUST)/.test(v))p[s.id]="J";else if(v[0]=="A"||v[0]=="F")p[s.id]="F"});return {...c,p}}).filter(c=>Object.keys(c.p).length);
 return {ES,AV,CH:att,tm};
}
function readCsv(fl){if(!fl)return;const r=new FileReader();r.onload=()=>{IMP=parseCsv(String(r.result));render()};r.readAsText(fl,"UTF-8")}
function iPanel(){
 const P=IMP;
 let h=`<div class="panel"><b>Importar planilha (CSV)</b><p class="mut" style="margin:4px 0 10px">No Google Planilhas: Arquivo → Fazer download → CSV (aba da turma). Lê alunos, turma, chamada e as avaliações de cada trimestre (nota e recuperação). Reimportar a mesma turma sobrescreve as notas e chamadas dela; fotos e status de arquivamento são mantidos.</p><input type="file" accept=".csv,text/csv" onchange="readCsv(this.files[0])"></div><div class="panel"><b>Importar fotos (JSON)</b><p class="mut" style="margin:4px 0 10px">Use os arquivos <code>fotos-...json</code> gerados pelo script da planilha. As fotos são ligadas aos alunos pelo nome. Importe o CSV antes.</p><input type="file" multiple accept=".json,application/json" onchange="impFotos(this.files)"></div>`;
 if(P){const ct={};P.AV.forEach(a=>{const k=MAT[a.mat]+" · "+a.tri+"º tri";ct[k]=(ct[k]||0)+1});
  h+=`<div class="panel"><b>Prévia</b><ul><li>${P.ES.length} alunos · turma <b>${esc(P.tm||"(sem turma)")}</b></li><li>${P.CH.length} dias de chamada</li><li>${P.AV.length} avaliações: ${Object.entries(ct).map(([k,v])=>esc(k)+" ("+v+")").join("; ")||"nenhuma"}</li></ul><div class="bar"><span>Aplicar a chamada em:</span><label><input type="checkbox" id="ck_ef" checked> Educação Física</label><label><input type="checkbox" id="ck_xd" checked> Xadrez</label></div><button class="b p" onclick="doImport()">Importar agora</button></div>`}
 return h;
}
async function doImport(){
 const P=IMP,ms=["ef","xd"].filter(m=>$("ck_"+m).checked);
 toast("Enviando dados para a nuvem…");
 const batch = firestore.batch();
 for(const s of P.ES) batch.set(userCol("alunos").doc(s.id),{...(A[s.id]||{}),nome:s.nome,turma:s.turma});
 for(const a of P.AV) batch.set(userCol("aval").doc("v_"+slug(a.mat+a.tri+a.turma+a.nome)),{mat:a.mat,tri:a.tri,nome:a.nome,data:a.data,turma:a.turma,notas:a.notas});
 for(const c of P.CH)for(const m of ms) batch.set(userCol("chamada").doc((m+"_"+P.tm+"_"+c.data).replace(/[^a-zA-Z0-9_-]/g,"_")),{mat:m,turma:P.tm,data:c.data,p:c.p});
 await batch.commit();
 toast("Importação concluída");S.turma=P.tm;S.tab="p";IMP=null;render();
}

const loadImg=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});
async function impFotos(fls){
 if(!fls||!fls.length)return;
 try{
  const idx={};Object.entries(A).forEach(([id,a])=>idx[slug(a.nome)]=id);
  let batch=firestore.batch(),n=0,ok=0,sem=0;
  toast("Processando fotos…");
  for(const fl of fls){
   const lista=JSON.parse(await fl.text());
   for(const it of lista){
    const id=idx[slug(it.nome||"")];
    if(!id||!it.foto){sem++;continue}
    const im=await loadImg(it.foto);
    const c=document.createElement("canvas");c.width=c.height=120;
    const k=Math.min(im.width,im.height);
    c.getContext("2d").drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,120,120);
    batch.set(userCol("alunos").doc(id),{...A[id],foto:c.toDataURL("image/jpeg",.7)});ok++;n++;
    if(n>=400){await batch.commit();batch=firestore.batch();n=0}
   }
  }
  if(n)await batch.commit();
  toast(ok+" foto(s) importada(s)"+(sem?" · "+sem+" sem correspondência":""));
 }catch(e){toast("Arquivo de fotos inválido")}
}

/* ---------- BACKUP ---------- */
function bPanel(){
 return `<div class="panel"><b>Usar sem internet</b><p class="mut" style="margin:4px 0 10px">Instale este aplicativo no computador ou celular enquanto estiver online e abra-o pelo menos uma vez com sua conta Google. Depois, ele abre sem internet e guarda as alterações neste aparelho; quando a conexão voltar, o Firebase sincroniza automaticamente.</p><p class="mut">No computador/Android, use <b>Instalar app</b> ou a opção de instalação do navegador. No iPhone/iPad, use Compartilhar → Adicionar à Tela de Início. A primeira instalação e o primeiro login precisam de internet. Alterações feitas offline em aparelhos diferentes só se encontram quando ambos sincronizarem; se editarem o mesmo dado, prevalece a última gravação.</p></div><div class="panel"><b>Baixar backup</b><p class="mut" style="margin:4px 0 10px">Seus dados já ficam salvos automaticamente na nuvem (Firebase), mas você pode baixar uma cópia de segurança em JSON a qualquer momento.</p><button class="b p" onclick="expBk()">Baixar backup (.json)</button></div><div class="panel"><b>Restaurar backup (ou migrar versão offline)</b><p class="mut" style="margin:4px 0 10px">Importa o arquivo <code>.json</code> gerado na versão offline ou em backups anteriores direto para a nuvem.</p><input type="file" accept=".json,application/json" onchange="impBk(this.files[0])"></div>`;
}
function expBk(){const b=new Blob([JSON.stringify({alunos:A,aval:V,chamada:C})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-notas-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove()}
function impBk(fl){
  if(!fl)return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o.alunos)throw 0;
      toast("Enviando backup para a nuvem…");
      const batch = firestore.batch();
      for(const [id,d] of Object.entries(o.alunos||{})) batch.set(userCol("alunos").doc(id), d);
      for(const [id,d] of Object.entries(o.aval||{})) batch.set(userCol("aval").doc(id), d);
      for(const [id,d] of Object.entries(o.chamada||{})) batch.set(userCol("chamada").doc(id), d);
      await batch.commit();
      toast("Backup sincronizado com sucesso!");
    }catch(e){toast("Arquivo de backup inválido")}
  };
  r.readAsText(fl);
}

/* ---------- SINCRONIZAÇÃO EM TEMPO REAL ---------- */
auth.onAuthStateChanged(async u => {
  await persistenceReady;
  user = u;
  unsubs.forEach(fn => fn());
  unsubs = [];
  pendingSync.clear();
  if (user) {
    const sub = (col, tgt) => userCol(col).onSnapshot({includeMetadataChanges:true},s => {
      if(s.metadata.hasPendingWrites)pendingSync.add(col);else pendingSync.delete(col);
      updateSyncStatus();
      const o = {};
      s.docs.forEach(d => o[d.id] = d.data());
      tgt(o);
      if(document.activeElement && document.activeElement.tagName=="INPUT" && S.tab=="v" && S.aid && document.activeElement.classList.contains("n")) return;
      render();
    }, e => toast("Erro de sincronização: " + e.message));
    unsubs.push(sub("alunos", o => A = o));
    unsubs.push(sub("aval", o => V = o));
    unsubs.push(sub("chamada", o => C = o));
    unsubs.push(sub("promocoes", o => HP = o));
  }
  updateSyncStatus();
  render();
});
</script>
